name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: OCR / PDF tools (collector tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-kor fonts-dejavu-core
      - name: Test-only Python deps (fixture images)
        run: pip install pillow
      - name: Unit tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v
